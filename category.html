<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deals — KDLS Deals</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .card__date { font-size: 0.8rem; color: var(--muted); }
    #deals-status {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-name">KDLS Deals</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">All</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">
    <h1 id="page-title" class="section-title">Deals</h1>
    <p id="deals-status" hidden></p>
    <div id="deals-grid" class="cards" aria-live="polite"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <script>document.write(new Date().getFullYear())</script> KDLS Deals</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="/disclosure">Affiliate Disclosure</a>
      <a href="/privacy">Privacy Policy</a>
    </nav>
    <p class="footer-disclosure">Prices are shown as entered by the site owner and may change. As an Amazon Associate we earn from qualifying purchases.</p>
  </div>
</footer>

<script src="/js/deals.js" defer></script>
</body>
</html>
