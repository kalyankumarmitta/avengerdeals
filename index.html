<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KDLS Deals — Best Amazon Deals Daily</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .hero {
      text-align: center;
      padding-block: 2.5rem 2rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .hero h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .hero p {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }
    .btn-telegram-hero {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--accent);
      color: #0a1a0e;
      font-size: 1rem;
      font-weight: 700;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      transition: background 0.15s;
    }
    .btn-telegram-hero:hover {
      background: var(--accent-dk);
      text-decoration: none;
      color: #0a1a0e;
    }
    .card__date {
      font-size: 0.8rem;
      color: var(--muted);
    }
    #deals-status {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="/" class="site-name">KDLS Deals</a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">All</a>
    </nav>
  </div>
</header>

<main>
  <div class="container">

    <section class="hero">
      <h1>KDLS Deals</h1>
      <p>Hand-picked Amazon deals on kitchen, home, and tools — updated daily.</p>
      <a class="btn-telegram-hero" href="https://t.me/avengerdeals_bot" target="_blank" rel="noopener noreferrer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.05 2.27L2.29 9.43c-1.3.5-1.28 1.21-.24 1.52l4.84 1.51 11.2-7.08c.53-.32 1.01-.15.61.21L8.35 15.3l-.31 4.98c.45 0 .65-.2.9-.44l2.16-2.1 4.49 3.32c.83.46 1.43.22 1.63-.77l2.95-13.93c.3-1.18-.45-1.71-1.12-1.09z"/>
        </svg>
        Join our Telegram channel
      </a>
    </section>

    <h2 class="section-title">Latest Deals</h2>

    <p id="deals-status" hidden>Loading deals…</p>
    <div id="deals-grid" class="cards" aria-live="polite"></div>

  </div>
</main>

<footer class="site-footer">
  <div class="container">
    <span>&copy; <script>document.write(new Date().getFullYear())</script> KDLS Deals</span>
    <nav class="footer-links" aria-label="Footer">
      <a href="/disclosure">Affiliate Disclosure</a>
      <a href="/privacy">Privacy Policy</a>
    </nav>
  </div>
</footer>

<script src="/js/deals.js" defer></script>
</body>
</html>
